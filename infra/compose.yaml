services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: senzy
      POSTGRES_USER: senzy
      POSTGRES_PASSWORD: senzy
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U senzy -d senzy"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - senzy-postgres:/var/lib/postgresql/data

volumes:
  senzy-postgres:
