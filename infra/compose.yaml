name: senzy

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: senzy
      POSTGRES_USER: senzy
      POSTGRES_PASSWORD: senzy
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U senzy -d senzy"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - type: bind
        source: /home/tony/data/senzy
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false

  migrate:
    build:
      context: ..
      dockerfile: api-server/Dockerfile
    command: ["--migrate"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=senzy;Username=senzy;Password=senzy
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: api-server/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=senzy;Username=senzy;Password=senzy
      DataProtection__KeyPath: /home/app/.aspnet/DataProtection-Keys
    ports:
      - "127.0.0.1:4001:8080"
    volumes:
      - api-keys:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  api-keys:
